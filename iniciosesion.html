<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./CSS/stylesRegistro.css">

</head>
<body>


  <!--BARRA DE NAVEGACIÓN-->
    <div id="navbar-placeholder"></div>

    
      <div class="container">
        <div class="flip-card" id="flipcard">
          <div class="flip-card-inner" id="flipcardInner">
            <div class="flip-card-front">

           

          <form id="registerForm">
            <h1>Registro</h1>
            <label for="txtnombre">Nombre</label>
            <input type="text" id="txtnombre" placeholder="Nombre completo" required>
            <label for="txtapellido">Apellidos</label>
            <input type="text" id="txtapellido" placeholder="Apellidos completos" required>
            <label for="txtcorreo">Correo</label>
            <input type="text" id="txtcorreo" placeholder="Correo electrónico" required>
            <label for="txtpassword">Contraseña</label>
            <input type="password" id="txtpassword" required>

            <label for="txtconfirmar">Confirmar contraseña</label>
            <input type="password" id="txtconfirmar" required>

            <button type="submit" class="btn btn-primary">Inscribirme</button>

            <span class="toggle-text" id="loginText">¿Ya tienes cuenta? Iniciar sesión</span>
             <div id="alertBox" class="alert d-none"></div>
          </form>
        </div>
        <div class="flip-card-back">

            <div id="alertLogin" class="alert d-none"></div> 

            <form id="loginform">
                <h1>Inicio de sesión</h1>
                <h3>Usa tu correo para ingresar</h3>
                <label for="iptnombre">Correo</label>
                <input type="text" id="iptnombre" placeholder="Correo electrónico" required>
                <label for="iptpasword">Contraseña</label>
                <input type="password" id="iptpasword" placeholder="Contraseña" required>
                <button class="btn btn-primary" type="submit">Iniciar sesión</button>
                <span class="toggle-text" id="registerText">¿No tienes cuenta? Regístrate</span>
            </form>
        
        </div>
        </div>
    </div>
  </div>

 
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <!--Archivo de barra de navegación-->
   <script src="./JS/nav.js" ></script>

       <script>
              fetch('./footer.html')
                     .then(response => response.text())
                     .then(data => {
                            document.getElementById('footer-placeholder').innerHTML = data;
                     });
       </script> -->
       <script src="./JS/iniciosesion.js" type="module"></script>
        <script src="./JS/main.js"></script>

        <script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("Nav.html") 
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar-placeholder").innerHTML = data;
      });
  });
</script>
</body>

</html>
