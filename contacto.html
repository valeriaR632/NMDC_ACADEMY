<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="./CSS/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
</head>

<body>
     <div id="navbar-placeholder"></div>
    <div style="text-align: center;">
        <h1 class="titulo">CONTACTO</h1>
        <img src="./ImagenesIntegrantes/Image20250807203716.png" alt="logoNMDC" id="logoM">
    </div>

    <!-- TARJETAS INFO -->
    <div class="row row-cols-1 row-cols-md-3 g-3">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5 class="cardTitle">Domicilio  </h5>
                    <p class="card-text">Av. Chapultepec #522 Roma Norte, Cuautémoc, 06700, CDMX</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5 class="cardTitle">Teléfono</h5>
                    <p class="card-text">(+52) 55 3074 2696</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5 class="cardTitle">E-mail:</h5>
                    <p class="card-text">nmdancec@gmail.com</p>
                </div>
            </div>
        </div>
    </div>

    <form class="formulario" id="contactoForm">
        <div class="row row-cols-1 row-cols-md-2 g-3">
            <div class="col">
                <label for="nombre" class="form-label">NOMBRE(S)</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre">
            </div>
            <div class="col">
                <label for="apellido" class="form-label">APELLIDO(S)</label>
                <input type="text" class="form-control" id="apellido" placeholder="Ingresa tu apellido (sin acentos o elementos extras)">
            </div>
            <div class="col">
                <label for="email" class="form-label">E-MAIL</label>
                <input type="text" class="form-control" id="email" placeholder="Ingresa tu e-mail">
            </div>
            <div class="col">
                <label for="telefono" class="form-label">TELÉFONO</label>
                <input type="tel" class="form-control" id="telefono" placeholder="Ingresa tu teléfono">
              


            </div>
        </div>
        <div class="mb-3">
            <label for="mensaje" class="form-label">CONTÁCTANOS</label>
            <textarea class="form-control" id="mensaje" rows="3" placeholder="Tu mensaje"></textarea>
        </div>
        <button type="submit" class="btn btn-info" id="boton">Enviar</button>
    </form>  
    <div class="alert alert-danger" role="alert" id="alertResultado"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init({
                publicKey: "qVMb1Aw-hiXIfCxSq",
            });
        })();
    </script> 
    <script src="./JS/contac.js"  type="module"></script>
    <script src="./JS/nav.js"></script>
    <script src="../NMDC_ACADEMY/JS/footer.js"></script> 

       <div id="footer-placeholder"></div>
</body>

<div id="footer-placeholder"></div>
       
       <script>
              fetch('./footer.html')
                     .then(response => response.text())
                     .then(data => {
                            document.getElementById('footer-placeholder').innerHTML = data;
                     });
       </script>


</html>
