
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <title>Formulario</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.2/examples/checkout/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- Favicons -->
    <link rel="apple-touch-icon" href="https://getbootstrap.com/docs/5.2/assets/img/favicons/apple-touch-icon.png" sizes="180x180">
    <link rel="icon" href="https://getbootstrap.com/docs/5.2/assets/img/favicons/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="https://getbootstrap.com/docs/5.2/assets/img/favicons/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="mask-icon" href="https://getbootstrap.com/docs/5.2/assets/img/favicons/safari-pinned-tab.svg" color="#712cf9">
    <meta name="theme-color" content="#712cf9">
    <link rel="stylesheet" href="./CSS/styles.css">
   <link rel="stylesheet" href="./CSS/formulario.css">


    <!-- estilos -->
    <link href="https://getbootstrap.com/docs/5.2/examples/checkout/form-validation.css" rel="stylesheet">
    
</head>

      <div id="navbar-placeholder"></div>
  <script>document.addEventListener("DOMContentLoaded", () => {
  fetch("Nav.html")
    .then(response => response.text())
    .then(data => {
    document.getElementById("navbar-placeholder").innerHTML = data;
    });
});</script>
<body style="background-color: black;">
 <!-- contenedor -->
<div class="container" id="contenedor">
    <main>
        <div class="py-5 text-center">
            <h2>Formulario</h2>
        </div>
        <div class="row">
            <div class="col-12 col-md-4 order-md-2 mb-4">
                <h4 class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted">Inscripción</span>
                    <span class="badge rounded-pill text-bg-danger" id="contadorClases">0</span>
                </h4>
                <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between lh-condensed">
                        <div>
                            <h5 class="my-0" id="totalClases">Total de clases</h5>
                        </div>
                        <span class="text-muted" id="clasesTotal">0</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between lh-condensed">
                        <div>
                            <h5 class="my-0" id="totalPrecio">Total</h5>
                        </div>
                        <span class="text-muted" id="precioTotal">$0</span>
                    </li>
                </ul>
            </div>

            <div class="col-12 col-md-8 order-md-1">
                <h4 class="mb-3">Agregar Clase</h4>
                <div class="alert alert-danger fade show" style="display:none;" role="alert" id="alertValidaciones">
                    <p id="alertValidacionesTexto"></p>
                </div>

                <form class="needs-validation" novalidate>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="Name">Nombre de la clase</label>
                            <input type="text" class="form-control" id="Name" autofocus placeholder="" value="" autocomplete="off" required>
                            <div class="invalid-feedback">
                                Nombre inválido
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="Number">Cantidad</label>
                            <input type="text" class="form-control" id="Number" placeholder="" value="" autocomplete="off" required>
                            <div class="invalid-feedback">
                                Cantidad inválida
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="horario">Elegir horario</label>
                        <select class="form-control" id="horario" onchange="actualizarPrecio()" required>
                            <option value="11:00 a 12:15">11:00 a 12:15</option>
                            <option value="12:15 a 13:30">12:15 a 13:30</option>
                            <option value="13:39 a 14:45">13:39 a 14:45</option>
                            <option value="14:45 a 16:00">14:45 a 16:00</option>
                            <option value="16:30 a 18:00">16:30 a 18:00</option>
                            <option value="18:00 a 19:00">18:00 a 19:00</option>
                            <option value="8:00 a 19:30">18:00 a 19:30</option>
                            <option value="19:30 a 21:00">19:30 a 21:00</option>
                        </select>
                        <div class="invalid-feedback">
                            Horario inválido
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="tipoClase">Tipo de clase:</label>
                        <select class="form-control" id="tipoClase" onchange="actualizarPrecio()" required>
                            <option value="">Seleccione...</option>
                            <option value="suelta">Suelta</option>
                            <option value="anualidad">Anualidad</option>
                        </select>
                    </div>
                    <hr/>
                    <div  class="d-grid gap-2 d-md-flex justify-content-md-start">
                        <button id="btnAgregar" class="btn btn-primary btn-sm w-100 w-md-auto" type="button">Agregar</button>
                        <button id="btnClear" class="btn btn-secondary btn-sm w-100 w-md-auto" type="button">Limpiar todo</button>
                        <a href="./clase2.html"> <button id="btnregresar" class="btn btn-secondary btn-sm w-100 w-md-auto" type="button">Agregar otra clase</button></a>
                    </div>
                    <hr class="mb-4">

                    <!-- tabla -->
                     <div class="table-responsive">
                    <table class="table text-center" id="tablaListaClases">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Clase</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Horario</th>
                                <th scope="col">Precio</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    </div>
                </form>
            </div>
        </div>
        
    </main>
</div>

<script src="https://getbootstrap.com/docs/5.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
<script src="./JS/formulario.js"></script>

<div id="footer-placeholder"></div>
       
       <script>
              fetch('./footer.html')
                     .then(response => response.text())
                     .then(data => {
                            document.getElementById('footer-placeholder').innerHTML = data;
                     });
       </script>
</body>
</html>
