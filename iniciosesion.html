<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./CSS/stylesRegistro.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>


  <!--BARRA DE NAVEGACIÓN-->

    <div id="navbar-placeholder"></div>

    
      <div class="container">
        <div class="flip-card" id="flipcard">
          <div class="flip-card-inner" id="flipcardInner">
            <div class="flip-card-front">

           

          <form id="registerForm">
            <h1 style="color: rgb(22, 16, 112); font-size: 37px; text-align: center; font-family: Josefin Sans;">REGISTRO</h1>
            <label for="txtnombre">Nombre</label>
            <input type="text" id="txtnombre" placeholder="Nombre" required>
            <label for="txtapellido">Apellido</label>
            <input type="text" id="txtapellido" placeholder="Apellidos" required>
            <label for="txtcorreo">Correo electrónico</label>
            <input type="text" id="txtcorreo" placeholder="Correo electrónico" required>
            <label for="txtpassword">Contraseña</label>
            <input type="password" id="txtpassword" placeholder="Contraseña (incluye sólo números y letras)" required>

            <label for="txtconfirmar">Confirmar contraseña</label>
            <input type="password" id="txtconfirmar" placeholder="Confirmar contraseña" required>

            <button type="submit" class="btn btn-primary">Registrarme</button>

            <span class="toggle-text" id="loginText">¿Ya tienes cuenta? Inicia sesión</span>
             <div id="alertBox" class="alert d-none"></div>
          </form>
        </div>
        <div class="flip-card-back">

        

            <form id="loginform">
                <h1 style="color: rgb(22, 16, 112); font-size: 37px; text-align: center; font-family: Josefin Sans;">INICIO DE SESIÓN</h1>
               <!-- <h3>Usa tu correo para ingresar</h3>--> 
                <label for="iptnombre">Correo</label>
                <input type="text" id="iptnombre" placeholder="Correo electrónico" required>
                <label for="iptpasword">Contraseña</label>
                <input type="password" id="iptpasword" placeholder="Contraseña" required>
                <button class="btn btn-primary" type="submit">Iniciar sesión</button>
                <span class="toggle-text" id="registerText">¿No tienes cuenta? Regístrate</span>
                  <div id="alertLogin" class="alert d-none"></div> 
            </form>
        
        </div>
        </div>
    </div>
  </div>

 
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <!--Archivo de barra de navegación-->
   <script src="./JS/nav.js" ></script>

       </script> -->
     <!-- <script src="./JS/iniciosesion.js" type="module"></script>--> 
        <script src="./JS/main.js"></script>

        <script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("Nav.html") 
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar-placeholder").innerHTML = data;
      });
  });
</script>
</body>

</html>
