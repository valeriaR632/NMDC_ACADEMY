<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body >
    <h1 class="text-center mb-4">Inscripcion </h1>
    
    <div class="card p-4 shadow">
    <form id="formulario">
      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre y apellidos" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Edad</label>
        <input type="number" class="form-control" id="edad" min="5" placeholder="Edad" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="pperz@correo.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="telefono" placeholder="Ej. 5551234567" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Selecciona un estilo de baile</label>
        <select class="form-select" id="estilo" required>
          <option value="hiphop">Hip Hop</option>
          <option value="Heels">Heels</option>
          <option value="Jazz">Jazz</option>
          <option value="Vogue">Vogue</option>
          <option value="K-Pop">K-Pop</option>
          <option value=" Reggaeton"> Reggaeton</option>
          <option value="Ballet">Ballet</option>
          <option value="Contemporaneo">Contemporaneo</option>
          <option value="Performance">Performance</option>
          <option value="House">House</option>
          
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Subir foto</label>
        <input type="file" class="form-control" id="foto" accept="image/*">
      </div>

      <button type="submit" class="btn btn-primary w-100">Enviar inscripción</button>
    </form>
  </div>

  <!-- <div id="alertContainer" class="mt-3"></div> -->
  <div class="alert alert-success"  id="alertContainer"  role="alert">
  A simple success alert—check it out!
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

<script src="./JS/formulario.js"></script>

</body>
</html>


    
</body>
</html>
